services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-horacerta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-horacerta}
      POSTGRES_DB: ${POSTGRES_DB:-horacerta}
    ports:
      - "5432:5432"
    volumes:
      - horacerta_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-horacerta} -d ${POSTGRES_DB:-horacerta}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: src/HoraCerta.Api/Dockerfile
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__HoraCerta: Host=postgres;Port=5432;Database=${POSTGRES_DB:-horacerta};Username=${POSTGRES_USER:-horacerta};Password=${POSTGRES_PASSWORD:-horacerta}
      Database__Provider: PostgreSQL
      Jwt__Key: ${JWT_KEY:-HoraCerta-Docker-Secret-Key-Min-32-Chars!!}
      Twilio__Enabled: ${TWILIO_ENABLED:-false}
      Twilio__AccountSid: ${TWILIO_ACCOUNT_SID:-}
      Twilio__AuthToken: ${TWILIO_AUTH_TOKEN:-}
      Twilio__WhatsAppFrom: ${TWILIO_WHATSAPP_FROM:-whatsapp:+14155238886}
      Twilio__WebhookBaseUrl: ${TWILIO_WEBHOOK_BASE_URL:-}
      Twilio__SessaoExpiracaoHoras: ${TWILIO_SESSAO_EXPIRACAO_HORAS:-24}
      Twilio__ValidarAssinaturaWebhook: ${TWILIO_VALIDAR_ASSINATURA:-false}
      Outbox__IntervaloProcessamentoSegundos: ${OUTBOX_INTERVALO_SEGUNDOS:-5}
      Outbox__MaxTentativas: ${OUTBOX_MAX_TENTATIVAS:-5}
      Outbox__LoteMaximo: ${OUTBOX_LOTE_MAXIMO:-20}
      WhatsApp__HorarioSilenciosoInicio: ${WHATSAPP_SILENCIO_INICIO:-22:00}
      WhatsApp__HorarioSilenciosoFim: ${WHATSAPP_SILENCIO_FIM:-08:00}
      WhatsApp__FusoHorario: ${WHATSAPP_FUSO_HORARIO:-America/Sao_Paulo}
    ports:
      - "5080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:8
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@horacerta.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - horacerta_pgadmin:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: src/horacerta-web
      dockerfile: Dockerfile
      args:
        API_URL: http://api:8080
        NEXT_PUBLIC_WHATSAPP_NUMERO: ${NEXT_PUBLIC_WHATSAPP_NUMERO:-}
    env_file:
      - .env
    environment:
      API_URL: ${API_URL:-http://api:8080}
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  horacerta_pgdata:
  horacerta_pgadmin:
