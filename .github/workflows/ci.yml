name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore src.sln
      - run: dotnet build src.sln -c Release --no-restore
      - run: dotnet test src.sln -c Release --no-build --verbosity normal

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/horacerta-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/horacerta-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          API_URL: http://localhost:5080

  frontend-e2e-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/horacerta-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/horacerta-web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          API_URL: http://localhost:5080
      - run: npx playwright install --with-deps chromium
      - run: npm run test:bdd:smoke
        env:
          CI: true
          API_URL: http://localhost:5080

  frontend-e2e-integracao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d postgres api
      - name: Aguardar API
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:5080/ && exit 0
            sleep 2
          done
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/horacerta-web/package-lock.json
      - working-directory: src/horacerta-web
        run: npm ci
      - working-directory: src/horacerta-web
        run: npm run build
        env:
          API_URL: http://localhost:5080
      - working-directory: src/horacerta-web
        run: npx playwright install --with-deps chromium
      - working-directory: src/horacerta-web
        run: npm run test:bdd:integracao
        env:
          CI: true
          API_URL: http://localhost:5080

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: cp .env.example .env
      - run: docker compose build
